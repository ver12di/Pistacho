<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="featuredPostPage.title">阅读评鉴</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="Certifiedstamp.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Quill's theme stylesheet to render formats correctly -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
    <script src="https://unpkg.com/i18next/i18next.min.js" defer></script>
    <script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.min.js" defer></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.min.js" defer></script>
    <script type="module" src="scripts/navbar.js"></script>
    <style>
        .lang-button { padding: 2px 6px; margin: 0 2px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: background-color 0.2s, border-color 0.2s; background-color: #f3f4f6; }
        .lang-button:hover { background-color: #e5e7eb; }
        .lang-button.active { font-weight: bold; background-color: #e0e7ff; border-color: #a5b4fc; color: #3730a3; cursor: default; }
        /* Custom prose styles for article content */
        .prose-custom h1, .prose-custom h2, .prose-custom h3 { color: #1f2937; }
        .prose-custom p { color: #374151; line-height: 1.75; }
        .prose-custom a { color: #4f46e5; }
        /* Override prose styles for Quill content */
        #article-body.ql-editor { padding: 0; }
        #article-body.ql-editor h1, #article-body.ql-editor h2, #article-body.ql-editor h3 { margin-top: 1.5em; margin-bottom: 0.5em; }
        #article-body.ql-editor p { margin-bottom: 1em; }
        #article-body.ql-editor blockquote { border-left-color: #a5b4fc; }
        /* Swiper styles from results.html */
        .swiper-container.main-swiper { width: 100%; position: relative; /* aspect-ratio removed for auto height */ }
        .main-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; background-color: #f3f4f6; }
        .main-swiper-image { width: 100%; height: auto; max-height: 100%; object-fit: contain; }
        .swiper-slide { height: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .swiper-wrapper { align-items: flex-start; }
        .swiper-slide img { display: block; width: 100%; height: auto; object-fit: contain; max-height: 80vh; }
        .swiper-button-next, .swiper-button-prev { color: #fff; background-color: rgba(0,0,0,0.3); padding: 10px; border-radius: 50%; width: 40px; height: 40px; } .swiper-button-next::after, .swiper-button-prev::after { font-size: 1.2rem; }
        .swiper-pagination { display: none !important; }
        .thumbnail-swiper .swiper-slide { width: 60px !important; height: 80px; opacity: 0.6; cursor: pointer; border: 2px solid transparent; transition: opacity 0.3s, border-color 0.3s; }
        .thumbnail-swiper .swiper-slide img { object-fit: cover; width: 100%; height: 100%;}
        .thumbnail-swiper .swiper-slide-thumb-active { opacity: 1; border-color: #4f46e5; } .thumbnail-swiper { margin-top: 0.5rem; padding: 5px 0; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="px-4 sm:px-6 lg:px-8 pt-4">
        <div class="mx-auto max-w-7xl">
            <div data-include-nav data-active="featured" data-language="flags"></div>
        </div>
    </div>

    <div id="error-container" class="hidden max-w-3xl mx-auto mt-8 bg-red-100 p-6 rounded-lg shadow-lg text-red-700 font-medium"></div>
    <div id="loading-indicator" class="text-center py-20 text-gray-500" data-i18n="common.loadingDetails">正在加载评鉴内容...</div>

    <main id="main-content" class="hidden max-w-3xl mx-auto mt-8 mb-16">
        <article class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 md:p-12">
            <!-- Article Header -->
            <header class="mb-8 text-center">
                <h1 id="article-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-3 leading-tight"></h1>
                <p id="article-meta" class="text-sm text-gray-500"></p>
            </header>

            <!-- Image Gallery -->
            <div id="image-gallery-container" class="mb-8 bg-white rounded-lg shadow-md overflow-hidden">
                <!-- Main Swiper -->
                <div class="swiper-container main-swiper bg-gray-200 relative">
                     <div class="swiper-wrapper" id="main-swiper-wrapper">
                         <!-- Slides will be injected here -->
                     </div>
                     <div class="swiper-pagination"></div>
                     <div class="swiper-button-next"></div>
                     <div class="swiper-button-prev"></div>
                </div>
                <!-- Thumbnail Swiper -->
                <div class="swiper-container thumbnail-swiper hidden"> <div class="swiper-wrapper" id="thumbnail-swiper-wrapper"></div> </div>
            </div>

            <!-- Article Body -->
            <div id="article-body" class="prose prose-lg max-w-none prose-custom ql-editor">
                <!-- Markdown content will be rendered here -->
            </div>

            <!-- Original Rating Info -->
            <div id="original-rating-info" class="mt-12 pt-8 border-t-2 border-dashed border-gray-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-3" data-i18n="featuredPostPage.originalInfo">原始评分摘要</h3>
                <div class="bg-gray-50 rounded-lg p-4 text-sm space-y-2">
                    <p><strong><span data-i18n="ratePage.cigarName"></span>:</strong> <span id="info-cigar-name"></span></p>
                    <p><strong><span data-i18n="resultsPage.size"></span>:</strong> <span id="info-cigar-size"></span></p>
                    <p><strong><span data-i18n="resultsPage.origin"></span>:</strong> <span id="info-cigar-origin"></span></p>
                    <p><strong><span data-i18n="common.score"></span>:</strong> <span id="info-score" class="font-bold text-indigo-600"></span></p>
                </div>
                <div class="mt-6 text-center">
                    <a id="view-original-link" href="#" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" data-i18n="featuredPostPage.viewOriginal">
                        查看原始评分
                    </a>
                </div>
            </div>
        </article>

        <!-- Comments Section -->
        <section id="comments-section" class="mt-12 bg-white rounded-2xl shadow-xl p-6 sm:p-8 md:p-10">
             <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                 <h3 class="text-xl font-bold text-gray-800" data-i18n="resultsPage.comments.title">其他用户评论区</h3>
                 <span id="comments-count" class="text-sm text-gray-500"></span>
             </div>
             <div id="comment-login-prompt" class="hidden mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-yellow-100 border border-yellow-200 text-yellow-800 rounded-lg px-4 py-3">
                 <span data-i18n="resultsPage.comments.loginPrompt">请先登录后再发表评论。</span>
                 <button onclick="login()" class="self-start sm:self-center px-3 py-1.5 text-xs font-semibold rounded bg-green-500 text-white hover:bg-green-600 transition" data-i18n="nav.login">登录/注册</button>
             </div>
             <div id="comment-muted-message" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 rounded-lg px-4 py-3 text-sm" data-i18n="resultsPage.comments.muted">您已被禁言，暂时无法发表评论。</div>
             <div id="comment-form-container" class="mb-6 space-y-2">
                 <textarea id="comment-input" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent min-h-[100px] resize-y" data-i18n="resultsPage.comments.placeholder" placeholder="写下你的看法吧..."></textarea>
                 <div class="flex items-center justify-between">
                     <p id="comment-status-message" class="hidden text-xs"></p>
                     <button id="comment-submit-button" class="ml-auto px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg shadow hover:bg-indigo-700 transition" data-i18n="resultsPage.comments.submit">发布评论</button>
                 </div>
             </div>
             <div id="comments-list" class="space-y-4">
                 <p id="comments-empty" class="text-sm text-gray-500" data-i18n="resultsPage.comments.empty">暂时还没有评论，快来抢沙发吧！</p>
             </div>
        </section>
    </main>

    <script type="module">
        // Re-using a simplified version of results.html's script
        let currentAuthUser = null;
        let ratingId = null;
        let mainSwiper = null;
        let thumbnailSwiper = null;
        let commentState = { comments: [], mutedUserIds: new Set(), currentUserMuted: false, currentUserId: null, currentUserRole: 'guest' };
        let commentStatusTimer = null;
        let commentSubmitBound = false;

        const AUTHING_APP_ID = '68f5b0b6875017c02b3bfdb3';
        const AUTHING_HOST = 'https://xfvu647mcdbk-demo.authing.cn';

        async function initI18n() {
            await i18next.use(i18nextHttpBackend).use(i18nextBrowserLanguageDetector).init({
                fallbackLng: 'zh', debug: false, ns: ['translation'], defaultNS: 'translation',
                backend: { loadPath: '/locales/{{lng}}.json?v=1' },
                detection: { order: ['localStorage', 'navigator'], caches: ['localStorage'] }
            });
            updateContent();
        }

        function updateContent() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const value = i18next.t(key);
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    if (el.hasAttribute('placeholder')) el.placeholder = value;
                } else {
                    el.innerHTML = value;
                }
            });
            document.title = i18next.t('featuredPostPage.title');
        }

        function renderLanguageSwitcher() {
            const container = document.getElementById('language-flags');
            if (!container || !i18next.isInitialized) return;
            container.innerHTML = '';
            const languages = ['zh', 'en', 'es'];
            const currentLang = i18next.language ? i18next.language.split('-')[0] : 'zh';
            languages.forEach(lang => {
                const button = document.createElement('button');
                button.textContent = lang.toUpperCase();
                button.className = `lang-button ${lang === currentLang ? 'active' : ''}`;
                button.dataset.lang = lang;
                button.onclick = async (e) => {
                    const newLang = e.target.dataset.lang;
                    if (newLang === currentLang) return;
                    await i18next.changeLanguage(newLang);
                    window.location.reload(); // Simple reload to re-render everything with new language
                };
                container.appendChild(button);
            });
        }

        window.login = function() {
            const redirectUri = window.location.href;
            const authorizeUrl = new URL('/oidc/auth', AUTHING_HOST);
            authorizeUrl.search = new URLSearchParams({ client_id: AUTHING_APP_ID, redirect_uri: redirectUri, response_type: 'code', scope: 'openid profile email phone', state: Math.random().toString(36).substring(2) }).toString();
            window.location.href = authorizeUrl.toString();
        }

        window.logout = function() {
            const logoutUrl = new URL('/oidc/session/end', AUTHING_HOST);
            logoutUrl.search = new URLSearchParams({ post_logout_redirect_uri: window.location.href }).toString();
            sessionStorage.removeItem('userInfo');
            sessionStorage.removeItem('accessToken');
            window.location.href = logoutUrl.toString();
        }

        function renderLoginStatus(user) {
            const container = document.getElementById('login-status-container');
            if (!container || !i18next.isInitialized) return;
            if (user) {
                const displayName = user.nickname || user.name || user.preferred_username || user.email || i18next.t('nav.loggedIn');
                container.innerHTML = `<span class="text-sm font-medium text-gray-700 mr-2 hidden sm:inline">${displayName}</span><button onclick="logout()" class="px-3 py-1 text-xs font-medium rounded-full bg-red-500 text-white hover:bg-red-600">${i18next.t('nav.logout')}</button>`;
            } else {
                container.innerHTML = `<button onclick="login()" class="px-3 py-1 text-xs font-medium rounded-full bg-green-500 text-white hover:bg-green-600">${i18next.t('nav.login')}</button>`;
            }
        }

        async function initSwipers(imageUrls = []) {
            const mainWrapper = document.getElementById('main-swiper-wrapper');
            const thumbWrapper = document.getElementById('thumbnail-swiper-wrapper');
            const thumbContainer = document.querySelector('.thumbnail-swiper');
            if (!mainWrapper || !thumbWrapper || !thumbContainer) return;

            mainWrapper.innerHTML = '';
            thumbWrapper.innerHTML = '';

            if (imageUrls.length === 0) {
                mainWrapper.innerHTML = `<div class="swiper-slide flex items-center justify-center text-gray-400 aspect-[1179/1572]">${i18next.t('common.noImage')}</div>`;
                thumbContainer.classList.add('hidden');
                if (mainSwiper) mainSwiper.destroy(true, true);
                if (thumbnailSwiper) thumbnailSwiper.destroy(true, true);
                mainSwiper = null;
                thumbnailSwiper = null;
                return;
            }

            imageUrls.forEach(key => {
                const imageUrl = `/api/image/${key}`;
                const imgElement = `<img src="${imageUrl}" alt="${i18next.t('common.cigarImageAlt')}" class="main-swiper-image" loading="lazy">`;
                mainWrapper.innerHTML += `<div class="swiper-slide">${imgElement}</div>`;
                thumbWrapper.innerHTML += `<div class="swiper-slide thumbnail-slide">${imgElement}</div>`;
            });

            if (mainSwiper) mainSwiper.destroy(true, true);
            if (thumbnailSwiper) thumbnailSwiper.destroy(true, true);

            if (imageUrls.length > 1) {
                thumbContainer.classList.remove('hidden');
                thumbnailSwiper = new Swiper('.thumbnail-swiper', {
                    spaceBetween: 10,
                    slidesPerView: 'auto',
                    freeMode: true,
                    watchSlidesProgress: true,
                });
            } else {
                thumbContainer.classList.add('hidden');
                thumbnailSwiper = null;
            }

            mainSwiper = new Swiper('.main-swiper', {
                spaceBetween: 10, autoHeight: true, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, pagination: { el: '.main-swiper .swiper-pagination', clickable: true }, thumbs: { swiper: thumbnailSwiper },
            });
        }

        async function handleOidcCallback(code) {
            try {
                const redirectUri = window.location.origin + window.location.pathname;
                const apiUrl = new URL('/api/authing/callback', window.location.origin);
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, redirect_uri: redirectUri }) });
                if (!response.ok) throw new Error(i18next.t('errors.authCallbackFailed', { status: response.status }));
                const fullUserProfile = await response.json();
                sessionStorage.setItem('userInfo', JSON.stringify(fullUserProfile));
                sessionStorage.setItem('accessToken', fullUserProfile.accessToken);
                return fullUserProfile;
            } catch (e) {
                console.error('Authentication callback handling failed:', e);
                alert(i18next.t('errors.loginFailed', { message: e.message }));
                return null;
            } finally {
                const cleanUrl = window.location.pathname + window.location.search.replace(/&?code=[^&]*/, '').replace(/&?state=[^&]*/, '');
                window.history.replaceState({}, document.title, cleanUrl);
            }
        }

        async function validateSessionAndGetUser() {
            const token = sessionStorage.getItem('accessToken');
            if (!token) return null;
            try {
                const response = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) {
                    sessionStorage.removeItem('userInfo');
                    sessionStorage.removeItem('accessToken');
                    return null;
                }
                const fullUserProfile = await response.json();
                sessionStorage.setItem('userInfo', JSON.stringify(fullUserProfile));
                return fullUserProfile;
            } catch (e) { return null; }
        }

        function renderBlogPost(data) {
            const { title, userNickname, timestamp, imageUrl, imageUrls, featured_content, cigarInfo, normalizedScore } = data;

            document.getElementById('article-title').textContent = title;
            
            const date = new Date(timestamp);
            const formattedDate = isNaN(date) ? i18next.t('common.unknownDate') : date.toLocaleDateString(i18next.language);
            document.getElementById('article-meta').textContent = `${i18next.t('common.by')} ${userNickname || i18next.t('common.anonymous')} · ${formattedDate}`;
            // Fix: API returns 'imageUrl' (array), results.html normalizes to 'imageUrls'. Check both.
            const imagesToDisplay = imageUrls || imageUrl || [];
            initSwipers(imagesToDisplay);

            const articleBody = document.getElementById('article-body');
            if (featured_content && typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                // Instead of parsing markdown, we directly set the HTML from Quill
                articleBody.innerHTML = DOMPurify.sanitize(featured_content);
            } else {
                articleBody.innerHTML = `<p class="italic text-gray-500">${i18next.t('common.noReview')}</p>`;
            }

            document.getElementById('info-cigar-name').textContent = cigarInfo?.name || i18next.t('common.unknown');
            document.getElementById('info-cigar-size').textContent = cigarInfo?.size || i18next.t('common.unknown');
            document.getElementById('info-cigar-origin').textContent = cigarInfo?.origin || i18next.t('common.unknown');
            document.getElementById('info-score').textContent = typeof normalizedScore === 'number' ? Math.trunc(normalizedScore) : 'N/A';

            const viewOriginalLink = document.getElementById('view-original-link');
            if (viewOriginalLink) {
                viewOriginalLink.href = `results.html?ratingId=${ratingId}`;
            }
        }

        // --- Comments Logic (copied from results.html and simplified) ---
        function formatCommentTimestamp(isoString) {
            if (!isoString) return '';
            try {
                return new Date(isoString).toLocaleString(i18next.language || 'zh', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (e) { return isoString; }
        }

        function renderCommentsSection() {
            const listEl = document.getElementById('comments-list');
            const emptyEl = document.getElementById('comments-empty');
            const countEl = document.getElementById('comments-count');
            if (countEl) countEl.textContent = i18next.t('resultsPage.comments.count', { count: commentState.comments?.length || 0 });
            if (!listEl) return;
            listEl.innerHTML = '';
            if (!commentState.comments || commentState.comments.length === 0) {
                if (emptyEl) emptyEl.classList.remove('hidden');
                return;
            }
            if (emptyEl) emptyEl.classList.add('hidden');
            commentState.comments.forEach(comment => {
                const item = document.createElement('div');
                item.className = 'border-t border-gray-200 pt-4';
                const authorDisplay = comment.userNickname || comment.userEmail || i18next.t('common.anonymous');
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-800">${authorDisplay}</p>
                        <p class="text-xs text-gray-500">${formatCommentTimestamp(comment.createdAt)}</p>
                    </div>
                    <p class="mt-2 text-sm text-gray-700 whitespace-pre-wrap break-words">${comment.content || ''}</p>
                `;
                listEl.appendChild(item);
            });
        }

        function updateCommentFormState() {
            const loginPrompt = document.getElementById('comment-login-prompt');
            const formContainer = document.getElementById('comment-form-container');
            if (!currentAuthUser) {
                if (loginPrompt) loginPrompt.classList.remove('hidden');
                if (formContainer) formContainer.classList.add('hidden');
            } else {
                if (loginPrompt) loginPrompt.classList.add('hidden');
                if (formContainer) formContainer.classList.remove('hidden');
            }
        }

        async function loadCommentsSection() {
            if (!ratingId) return;
            if (!commentSubmitBound) {
                document.getElementById('comment-submit-button')?.addEventListener('click', handleCommentSubmit);
                commentSubmitBound = true;
            }
            try {
                const apiUrl = new URL('/api/comments', window.location.origin);
                apiUrl.searchParams.set('ratingId', ratingId);
                const headers = {};
                const token = sessionStorage.getItem('accessToken');
                if (token) headers['Authorization'] = `Bearer ${token}`;
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                commentState.comments = Array.isArray(data.comments) ? data.comments : [];
                renderCommentsSection();
                updateCommentFormState();
            } catch (error) {
                console.error('Failed to load comments:', error);
            }
        }

        async function handleCommentSubmit(event) {
            event.preventDefault();
            const textarea = document.getElementById('comment-input');
            const content = (textarea.value || '').trim();
            if (!content) return;
            const token = sessionStorage.getItem('accessToken');
            if (!token) { alert(i18next.t('common.loginRequired')); return; }
            const submitButton = document.getElementById('comment-submit-button');
            submitButton.disabled = true;
            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ ratingId, content })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                textarea.value = '';
                await loadCommentsSection();
            } catch (error) {
                console.error('Failed to submit comment:', error);
                alert(i18next.t('resultsPage.comments.postFailed', { msg: error.message }));
            } finally {
                submitButton.disabled = false;
            }
        }

        // --- Page Initialization ---
        window.onload = async function() {
            const errorContainer = document.getElementById('error-container');
            const mainContent = document.getElementById('main-content');
            const loadingIndicator = document.getElementById('loading-indicator');

            try {
                await initI18n();
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                ratingId = urlParams.get('ratingId');

                const authPromise = code ? handleOidcCallback(code) : validateSessionAndGetUser();
                
                if (!ratingId) {
                    throw new Error(i18next.t('errors.noRatingDataFound'));
                }

                const dataPromise = (async () => {
                    const apiUrl = new URL(`/api/ratings?id=${ratingId}`, window.location.origin);
                    const currentLang = (i18next.language || 'zh').split('-')[0];
                    apiUrl.searchParams.set('lang', currentLang);
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error(i18next.t('errors.loadRatingFailed', { status: response.status }));
                    const data = await response.json();
                    if (!data.is_featured || !data.featured_content) {
                        // This is not a featured review, redirect to the standard results page.
                        window.location.replace(`results.html?ratingId=${ratingId}`);
                        return null; // Stop further execution
                    }
                    return data;
                })();

                const [user, ratingData] = await Promise.all([authPromise, dataPromise]);
                currentAuthUser = user;

                if (!ratingData) return; // Redirecting, so stop.

                renderLoginStatus(currentAuthUser);
                renderLanguageSwitcher();
                renderBlogPost(ratingData);
                loadCommentsSection();

                loadingIndicator.classList.add('hidden');
                mainContent.classList.remove('hidden');

            } catch (e) {
                loadingIndicator.classList.add('hidden');
                errorContainer.innerHTML = `<p class="font-bold text-center">${i18next.t('errors.pageLoadError')}: ${e.message}</p>`;
                errorContainer.classList.remove('hidden');
                mainContent.classList.add('hidden');
                console.error("Initialization error:", e);
            }
        };

        document.addEventListener('navbar:loaded', () => {
            renderLanguageSwitcher();
            renderLoginStatus(currentAuthUser);
        });
    </script>
</body>
</html>
